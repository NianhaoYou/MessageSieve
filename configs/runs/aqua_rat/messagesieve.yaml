_base: ../../qwen3_8b.yaml
name: qwen3_8b_aqua_rat_messagesieve
method: messagesieve
method_params:
  dataset_id: aqua
  task_family: math
  base_graph_variant: full
dataset:
  dataset_id: aqua
  path: data/aqua_rat/test.jsonl
  split: test
  start_index: 0
  limit: 254
runtime:
  output_dir: outputs/qwen3_8b/aqua_rat
  save_predictions: true
  save_trajectories: true
  write_progress: true
  progress_every: 1
  parallel_samples: 10
  num_rounds_override: 2
  skip_failed_samples: false
  contract:
    expected_worker_count: 4
    expected_judge_enabled: true
    task_metadata:
      prompt_protocol: mas
